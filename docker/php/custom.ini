[PHP]
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
expose_php = Off
date.timezone = Asia/Makassar

; Error reporting untuk production
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
