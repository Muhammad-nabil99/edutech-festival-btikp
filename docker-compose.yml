services:
  # ----------------------------------------------------------------------------
  # Service Backend Application (PHP 8.4 FPM)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edutech_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-EduTech Festival BTIKP}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:JT9aGYirFJTYGQMyYl7DYKWmWj7JTrX5dRVtl/YAxMQ=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8085}"
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: "${DOCKER_DB_HOST:-db}"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-edutech_festival_btikp}"
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      FILESYSTEM_DISK: public
      AUTO_MIGRATE: "true"
      AUTO_SEED: "${AUTO_SEED:-true}"
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - edutech_public:/var/www/html/public-shared
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edutech_network

  # ----------------------------------------------------------------------------
  # Service Web Server (Nginx)
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: edutech_festival_btikp
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - edutech_public:/var/www/html/public:ro
      - storage_public:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - edutech_network

  # ----------------------------------------------------------------------------
  # Service Database (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: edutech_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-edutech_festival_btikp}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - edutech_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 15s
    networks:
      - edutech_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  storage_public:
    name: edutech_storage_public
  edutech_db_data:
    name: edutech_mysql_data
  edutech_public:
    name: edutech_public_data

networks:
  edutech_network:
    name: edutech_network
    driver: bridge
