services:
  # ----------------------------------------------------------------------------
  # Service Backend Application (PHP 8.3 FPM)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edutech_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-EduTech Festival BTIKP}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:JT9aGYirFJTYGQMyYl7DYKWmWj7JTrX5dRVtl/YAxMQ=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8085}"
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: "${DOCKER_DB_HOST:-db}"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-edutech_festival_btikp}"
      DB_USERNAME: "${DB_USERNAME:-edutech_user}"
      DB_PASSWORD: "${DB_PASSWORD:-edutech_secret_2026}"
      SESSION_DRIVER: database
      FILESYSTEM_DISK: public
      AUTO_MIGRATE: "true"
      AUTO_SEED: "${AUTO_SEED:-true}"
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edutech_network

  # ----------------------------------------------------------------------------
  # Service Web Server (Nginx)
  # ----------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: edutech_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/html/public/storage:ro
    depends_on:
      - app
    networks:
      - edutech_network

  # ----------------------------------------------------------------------------
  # Service Database (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: edutech_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-edutech_festival_btikp}"
      MYSQL_USER: "${DB_USERNAME:-edutech_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-edutech_secret_2026}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_2026}"
    ports:
      - "${DOCKER_DB_PORT:-3308}:3306"
    volumes:
      - edutech_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - edutech_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  storage_public:
    name: edutech_storage_public
  edutech_db_data:
    name: edutech_mysql_data

networks:
  edutech_network:
    name: edutech_network
    driver: bridge
